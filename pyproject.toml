[project]
name = "lineage-check"
version = "0.1.0"
description = "Tell whether a model is a modified copy of a listed open-weight model, from its weights alone"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "requests>=2.31",
    "cryptography>=42,<51",    # 51 may refuse AMD's chip certificates (serial number 0); tested with 44 and 50
]

[project.optional-dependencies]
experiments = ["transformers>=4.44", "pyarrow>=15", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
lineage-check = "lineage_check.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lineage_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
